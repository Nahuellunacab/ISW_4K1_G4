[flake8]
max-line-length = 79
extend-ignore = E203, W503
exclude = 
    .git,
    __pycache__,
    .vscode,
    *.db

[pycodestyle]
max-line-length = 79
exclude = 
    .git,
    __pycache__,
    .vscode,
    *.db

[pydocstyle]
inherit = false
ignore = D100,D101,D102,D103,D104,D105,D106,D107
match-dir = (?!migrations).*