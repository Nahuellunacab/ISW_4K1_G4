[pytest]
# Configuración de pytest para el proyecto

# Directorio donde buscar tests
testpaths = tests

# Patrón para encontrar archivos de test
python_files = test_*.py

# Patrón para encontrar clases de test
python_classes = Test*

# Patrón para encontrar funciones de test
python_functions = test_*

# Opciones por defecto al ejecutar pytest
addopts = 
    -v
    --strict-markers
    --tb=short
    --disable-warnings

# Markers personalizados
markers =
    unit: Tests unitarios rápidos
    integration: Tests de integración con DB
    slow: Tests que tardan más tiempo
